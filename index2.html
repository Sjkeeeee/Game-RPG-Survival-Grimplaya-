<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
<title>Survivors — Diablo Style</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #030104; overflow: hidden; font-family: system-ui, sans-serif; color: #c9a06c; touch-action: none; user-select: none; }
  canvas { display: block; background: #030104; }
  
  #ui {
    position: absolute; top: 12px; left: 12px;
    font-size: 14px; line-height: 1.55;
    pointer-events: none; text-shadow: 0 2px 8px #000;
    z-index: 10;
  }
  #ui span { color: #e8c48a; }
  
  #pause-btn {
    position: absolute; top: 12px; right: 12px;
    width: 40px; height: 40px;
    background: rgba(18,6,6,0.85);
    border: 1px solid #6a3030;
    border-radius: 6px; color: #c9a06c;
    font-size: 17px; display: none;
    align-items: center; justify-content: center;
    cursor: pointer; z-index: 10;
  }
  
  .screen {
    position: absolute; inset: 0;
    background: rgba(4,1,3,0.96);
    display: none; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 12px; z-index: 20;
    padding: 20px;
    overflow-y: auto;
  }
  
  .btn {
    background: #120808;
    border: 2px solid #8b3a3a;
    color: #e8c48a;
    padding: 12px 24px;
    font-size: 16px;
    border-radius: 4px;
    cursor: pointer;
    min-width: 220px;
    letter-spacing: 0.4px;
    transition: 0.12s;
  }
  .btn:hover { background: #8b3a3a; color: #fff; }
  .btn:disabled { opacity: 0.4; border-color: #444; color: #666; }
  .btn.small { min-width: auto; padding: 9px 16px; font-size: 14px; }
  .btn.danger { border-color: #a03030; color: #e08080; }
  
  h1 { color: #c9a06c; font-size: 34px; letter-spacing: 3px; text-shadow: 0 0 22px rgba(140,25,25,0.65); margin-bottom: 2px; }
  h2 { color: #c9a06c; font-size: 24px; }
  
  #hp-wrap {
    position: absolute; bottom: 18px; left: 50%;
    transform: translateX(-50%);
    width: 240px; height: 15px;
    background: #0e0606;
    border: 1px solid #5a2828;
    border-radius: 3px;
    overflow: hidden;
    display: none;
    z-index: 10;
  }
  #hp-bar {
    height: 100%;
    background: linear-gradient(90deg, #5a1010, #c43c3c);
    width: 100%;
    transition: width 0.1s;
  }
  
  #coin-display {
    color: #ffd700;
    font-size: 18px;
    margin-bottom: 8px;
  }
  
  .shop-item {
    background: #140a0a;
    border: 1px solid #5a3030;
    border-radius: 6px;
    padding: 12px 16px;
    width: 280px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
  }
  .shop-item .info { text-align: left; }
  .shop-item .name { color: #e8c48a; font-size: 15px; }
  .shop-item .desc { color: #8a6a5a; font-size: 12px; margin-top: 2px; }
  .shop-item .cost { color: #ffd700; font-size: 14px; white-space: nowrap; }
  
  #level-up {
    position: absolute; inset: 0;
    background: rgba(5,1,3,0.93);
    display: none; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 12px; z-index: 25;
  }
  
  .stat-line { color: #a08070; font-size: 15px; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="ui" style="display:none">
  <div>Время: <span id="time">0</span>s</div>
  <div>Убийства: <span id="kills">0</span></div>
  <div>Уровень: <span id="level">1</span></div>
  <div>Опыт: <span id="xp">0</span>/<span id="xp-next">6</span></div>
</div>

<div id="pause-btn">⏸</div>
<div id="hp-wrap"><div id="hp-bar"></div></div>

<!-- MAIN MENU -->
<div id="main-menu" class="screen" style="display:flex">
  <h1>SURVIVORS</h1>
  <p style="color:#7a5040; letter-spacing:2px; margin-bottom:4px">DIABLO STYLE</p>
  <p style="color:#5a3830; font-size:13px; margin-bottom:22px">v0.6</p>
  <button class="btn" id="play-btn">Играть</button>
  <button class="btn" id="shop-btn">Улучшения</button>
  <button class="btn" id="settings-btn">Настройки</button>
  <button class="btn small danger" id="reset-btn" style="margin-top:10px">Сбросить прогресс</button>
</div>

<!-- SHOP -->
<div id="shop-screen" class="screen">
  <h2>Магазин</h2>
  <div id="coin-display">Монеты: 0</div>
  <div id="shop-items" style="display:flex;flex-direction:column;gap:10px;max-height:55vh;overflow-y:auto"></div>
  <button class="btn" id="shop-back" style="margin-top:14px">Назад</button>
</div>

<!-- SETTINGS -->
<div id="settings-screen" class="screen">
  <h2>Настройки</h2>
  <div style="display:flex;flex-direction:column;gap:14px;width:260px">
    <label style="display:flex;justify-content:space-between;align-items:center;color:#c9a06c">
      Вибрация
      <input type="checkbox" id="set-vibro" checked style="width:20px;height:20px">
    </label>
    <label style="display:flex;justify-content:space-between;align-items:center;color:#c9a06c">
      Показывать FPS
      <input type="checkbox" id="set-fps" style="width:20px;height:20px">
    </label>
  </div>
  <button class="btn" id="settings-back" style="margin-top:20px">Назад</button>
</div>

<!-- PAUSE -->
<div id="pause-screen" class="screen">
  <h2>Пауза</h2>
  <button class="btn" id="resume-btn">Продолжить</button>
  <button class="btn" id="pause-restart">Заново</button>
  <button class="btn" id="pause-menu">В меню</button>
</div>

<!-- LEVEL UP -->
<div id="level-up">
  <h2 style="color:#c9a06c; font-size:26px">LEVEL UP</h2>
  <p style="color:#8a6a5a; margin-bottom:8px">Выбери улучшение</p>
  <div id="upgrade-options" style="display:flex;flex-direction:column;gap:10px"></div>
</div>

<!-- GAME OVER -->
<div id="game-over" class="screen">
  <h1 style="color:#a02828">YOU DIED</h1>
  <div class="stat-line">Выжил: <span id="final-time">0</span>s</div>
  <div class="stat-line">Убийств: <span id="final-kills">0</span></div>
  <div class="stat-line">Рекорд времени: <span id="best-time">0</span>s</div>
  <div class="stat-line">Рекорд убийств: <span id="best-kills">0</span></div>
  <div id="coins-earned" style="color:#ffd700;font-size:20px;margin:12px 0"></div>
  <button class="btn" id="restart-btn">Заново</button>
  <button class="btn" id="to-shop-btn">В магазин</button>
  <button class="btn small" id="to-menu-btn">В меню</button>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
  W = canvas.width = innerWidth;
  H = canvas.height = innerHeight;
}
addEventListener('resize', resize);
resize();

// ==================== META ====================
const defaultMeta = {
  coins: 40,
  upgrades: {
    damage: 0,
    maxHp: 0,
    attackSpeed: 0,
    moveSpeed: 0,
    xpGain: 0
  },
  bestTime: 0,
  bestKills: 0,
  settings: { vibro: true, showFps: false }
};
let meta = JSON.parse(localStorage.getItem('survivorsDiabloMeta')) || structuredClone(defaultMeta);

function saveMeta() {
  localStorage.setItem('survivorsDiabloMeta', JSON.stringify(meta));
}

function upgradeCost(type, lvl) {
  const base = { damage: 70, maxHp: 90, attackSpeed: 80, moveSpeed: 75, xpGain: 85 };
  return Math.floor(base[type] * Math.pow(1.65, lvl));
}

// ==================== WORLD ====================
const WORLD = 3400;
const camera = { x: 0, y: 0 };
let obstacles = [];
let groundStains = [];

// ==================== STATE ====================
let state = { phase: 'menu', time: 0, kills: 0, level: 1, xp: 0, xpNext: 6 };
let player = {};
let enemies = [];
let projectiles = [];
let particles = [];
let keys = {};
let touch = null;
let lastTs = 0;
let spawnT = 1.15;
let tankT = 10;
let bossT = 75;
let bossActive = false;
let shake = 0;
let fps = 0, frames = 0, fpsTimer = 0;

// ==================== INIT WORLD ====================
function generateWorld() {
  obstacles = [];
  groundStains = [];
  for (let i = 0; i < 30; i++) {
    const x = 180 + Math.random() * (WORLD - 360);
    const y = 180 + Math.random() * (WORLD - 360);
    if (Math.hypot(x - WORLD/2, y - WORLD/2) < 320) continue;
    obstacles.push({
      x, y,
      w: 28 + Math.random() * 36,
      h: 22 + Math.random() * 30,
      type: Math.random() > 0.55 ? 'ruin' : 'bone'
    });
  }
}

// ==================== PLAYER ====================
function applyMetaToPlayer() {
  player.damageMult = 1 + meta.upgrades.damage * 0.11;
  player.maxHp = 100 + meta.upgrades.maxHp * 22;
  player.hp = player.maxHp;
  player.attackRate = 0.38 / (1 + meta.upgrades.attackSpeed * 0.13);
  player.speed = 200 * (1 + meta.upgrades.moveSpeed * 0.09);
  player.xpMult = 1 + meta.upgrades.xpGain * 0.14;
}

function resetPlayer() {
  player = {
    x: WORLD / 2,
    y: WORLD / 2,
    r: 20,
    hp: 100,
    maxHp: 100,
    speed: 200,
    damage: 16,
    damageMult: 1,
    attackRate: 0.38,
    attackCD: 0,
    facing: 1,
    walkPhase: 0,
    attacking: 0,
    xpMult: 1,
    hasNova: false,
    novaCD: 0
  };
  applyMetaToPlayer();
}

// ==================== DRAW HELPERS ====================
function drawShadow(x, y, rx, ry) {
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.beginPath();
  ctx.ellipse(x, y + 8, rx, ry, 0, 0, Math.PI * 2);
  ctx.fill();
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.roundRect(x, y, w, h, r);
}

// ==================== PLAYER DRAW ====================
function drawPlayer() {
  const p = player;
  const t = p.walkPhase;
  const legL = Math.sin(t) * 4.2;
  const legR = Math.sin(t + Math.PI) * 4.2;
  const bob = Math.abs(Math.sin(t)) * 1.4;

  ctx.save();
  ctx.translate(p.x, p.y - bob);

  const glow = ctx.createRadialGradient(0, 4, 4, 0, 4, 55);
  glow.addColorStop(0, 'rgba(180, 30, 20, 0.28)');
  glow.addColorStop(0.5, 'rgba(120, 15, 10, 0.12)');
  glow.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.arc(0, 6, 55, 0, Math.PI * 2);
  ctx.fill();

  if (p.facing < 0) ctx.scale(-1, 1);

  drawShadow(0, bob, 17, 7);

  // Cape
  ctx.fillStyle = '#12060c';
  ctx.beginPath();
  ctx.moveTo(-13, -10);
  ctx.quadraticCurveTo(-22, 6 + Math.sin(t * 0.6) * 4, -12, 26);
  ctx.lineTo(12, 26);
  ctx.quadraticCurveTo(22, 6 + Math.sin(t * 0.6 + 1.2) * 4, 13, -10);
  ctx.closePath();
  ctx.fill();

  // Legs
  ctx.fillStyle = '#1a1a24';
  roundRect(-10, 6 + legL * 0.35, 9, 17, 3); ctx.fill();
  roundRect(1, 6 + legR * 0.35, 9, 17, 3); ctx.fill();
  ctx.fillStyle = '#2a2a36';
  roundRect(-11, 20 + legL * 0.35, 11, 7, 2); ctx.fill();
  roundRect(0, 20 + legR * 0.35, 11, 7, 2); ctx.fill();

  // Body
  const bodyGrad = ctx.createLinearGradient(0, -20, 0, 14);
  bodyGrad.addColorStop(0, '#3e3e4e');
  bodyGrad.addColorStop(0.45, '#2c2c3a');
  bodyGrad.addColorStop(1, '#1a1a26');
  ctx.fillStyle = bodyGrad;
  roundRect(-14, -16, 28, 30, 6); ctx.fill();

  ctx.fillStyle = '#252532';
  roundRect(-10, -11, 20, 18, 4); ctx.fill();

  // Pauldrons
  ctx.fillStyle = '#363648';
  ctx.beginPath(); ctx.arc(-15, -7, 8.5, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(15, -7, 8.5, 0, Math.PI * 2); ctx.fill();

  // Spikes
  ctx.fillStyle = '#1e1e2a';
  ctx.beginPath(); ctx.moveTo(-15, -15); ctx.lineTo(-19, -27); ctx.lineTo(-11, -15); ctx.fill();
  ctx.beginPath(); ctx.moveTo(15, -15); ctx.lineTo(19, -27); ctx.lineTo(11, -15); ctx.fill();

  // Helmet
  const helmGrad = ctx.createRadialGradient(-3, -29, 3, 0, -27, 15);
  helmGrad.addColorStop(0, '#3a3a4a');
  helmGrad.addColorStop(1, '#1c1c28');
  ctx.fillStyle = helmGrad;
  ctx.beginPath(); ctx.arc(0, -28, 13, 0, Math.PI * 2); ctx.fill();

  ctx.fillStyle = '#0c0c12';
  roundRect(-9, -31, 18, 8, 2); ctx.fill();

  ctx.fillStyle = '#ff1a00';
  ctx.shadowColor = '#ff0000';
  ctx.shadowBlur = 14;
  ctx.beginPath();
  ctx.arc(-4.5, -27.5, 2.6, 0, Math.PI * 2);
  ctx.arc(4.5, -27.5, 2.6, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;

  // Horns
  ctx.fillStyle = '#2a1a10';
  ctx.beginPath(); ctx.moveTo(-9, -38); ctx.lineTo(-15, -54); ctx.lineTo(-5, -39); ctx.fill();
  ctx.beginPath(); ctx.moveTo(9, -38); ctx.lineTo(15, -54); ctx.lineTo(5, -39); ctx.fill();

  // Sword
  ctx.save();
  let swing = 0.55;
  if (p.attacking > 0) swing = 0.55 - Math.sin((1 - p.attacking) * Math.PI) * 1.7;
  ctx.rotate(swing);
  const bladeG = ctx.createLinearGradient(18, -10, 48, 6);
  bladeG.addColorStop(0, '#5a5a6e');
  bladeG.addColorStop(1, '#2a2a38');
  ctx.fillStyle = bladeG;
  ctx.beginPath();
  ctx.moveTo(16, -8); ctx.lineTo(50, 1); ctx.lineTo(48, 7); ctx.lineTo(16, 3);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#1a1a24';
  roundRect(13, -11, 6, 16, 2); ctx.fill();
  ctx.restore();

  ctx.restore();
}

// ==================== ENEMY DRAW ====================
function drawEnemy(e) {
  const t = e.walkPhase;
  const scale = e.dying ? e.deathScale : 1;
  const bob = e.dying ? 0 : Math.abs(Math.sin(t)) * 1.2;

  ctx.save();
  ctx.translate(e.x, e.y - bob);
  ctx.scale(scale, scale);
  if (e.facing < 0) ctx.scale(-1, 1);

  drawShadow(0, bob, e.r * 0.95, e.r * 0.38);

  if (e.type === 'boss') {
    // Boss
    ctx.fillStyle = '#1a0610';
    roundRect(-18, 10 + Math.sin(t)*2, 14, 18, 3); ctx.fill();
    roundRect(4, 10 + Math.sin(t+3)*2, 14, 18, 3); ctx.fill();

    const bg = ctx.createRadialGradient(-6, -10, 8, 0, 0, 40);
    bg.addColorStop(0, '#6b1a3a');
    bg.addColorStop(1, '#2a0618');
    ctx.fillStyle = bg;
    ctx.beginPath(); ctx.ellipse(0, -6, 32, 28, 0, 0, Math.PI * 2); ctx.fill();

    ctx.fillStyle = '#3a0a20';
    ctx.beginPath(); ctx.arc(0, -34, 18, 0, Math.PI * 2); ctx.fill();

    ctx.fillStyle = '#1a1008';
    ctx.beginPath(); ctx.moveTo(-12, -48); ctx.lineTo(-24, -78); ctx.lineTo(-4, -50); ctx.fill();
    ctx.beginPath(); ctx.moveTo(12, -48); ctx.lineTo(24, -78); ctx.lineTo(4, -50); ctx.fill();

    ctx.fillStyle = '#ff1a00';
    ctx.shadowColor = '#ff0000';
    ctx.shadowBlur = 16;
    ctx.beginPath();
    ctx.arc(-7, -35, 4.5, 0, Math.PI * 2);
    ctx.arc(7, -35, 4.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;

  } else if (e.type === 'tank') {
    ctx.fillStyle = '#22080a';
    roundRect(-15, 8 + Math.sin(t)*2.5, 12, 17, 3); ctx.fill();
    roundRect(3, 8 + Math.sin(t+3)*2.5, 12, 17, 3); ctx.fill();

    const bg = ctx.createRadialGradient(-5, -8, 6, 0, 0, 30);
    bg.addColorStop(0, '#7a2228');
    bg.addColorStop(1, '#3a0c10');
    ctx.fillStyle = bg;
    ctx.beginPath(); ctx.ellipse(0, -4, 24, 22, 0, 0, Math.PI * 2); ctx.fill();

    ctx.fillStyle = '#4a1014';
    ctx.beginPath(); ctx.arc(0, -26, 14, 0, Math.PI * 2); ctx.fill();

    ctx.fillStyle = '#1a1008';
    ctx.beginPath(); ctx.moveTo(-10, -36); ctx.lineTo(-19, -58); ctx.lineTo(-4, -38); ctx.fill();
    ctx.beginPath(); ctx.moveTo(10, -36); ctx.lineTo(19, -58); ctx.lineTo(4, -38); ctx.fill();

    ctx.fillStyle = '#ff1a00';
    ctx.shadowColor = '#ff0000';
    ctx.shadowBlur = 12;
    ctx.beginPath();
    ctx.arc(-5.5, -27, 3.4, 0, Math.PI * 2);
    ctx.arc(5.5, -27, 3.4, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;

  } else {
    // Imp
    ctx.fillStyle = '#22060a';
    roundRect(-9, 6 + Math.sin(t)*2.8, 8, 14, 2); ctx.fill();
    roundRect(1, 6 + Math.sin(t+3)*2.8, 8, 14, 2); ctx.fill();

    const bg = ctx.createRadialGradient(-3, -5, 4, 0, 0, 18);
    bg.addColorStop(0, '#8a282e');
    bg.addColorStop(1, '#3a0c12');
    ctx.fillStyle = bg;
    ctx.beginPath(); ctx.ellipse(0, -3, 14, 15, 0, 0, Math.PI * 2); ctx.fill();

    ctx.fillStyle = '#4a1016';
    ctx.beginPath(); ctx.arc(0, -20, 10, 0, Math.PI * 2); ctx.fill();

    ctx.fillStyle = '#1a1008';
    ctx.beginPath(); ctx.moveTo(-7, -27); ctx.lineTo(-13, -42); ctx.lineTo(-2, -28); ctx.fill();
    ctx.beginPath(); ctx.moveTo(7, -27); ctx.lineTo(13, -42); ctx.lineTo(2, -28); ctx.fill();

    ctx.fillStyle = '#ff1a00';
    ctx.shadowColor = '#ff0000';
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.arc(-4, -20, 2.7, 0, Math.PI * 2);
    ctx.arc(4, -20, 2.7, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;

    ctx.fillStyle = '#2a0a0e';
    ctx.beginPath(); ctx.ellipse(-16, -7, 11, 6, -0.6, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(16, -7, 11, 6, 0.6, 0, Math.PI * 2); ctx.fill();
  }

  if (e.hp < e.maxHp && !e.dying) {
    ctx.fillStyle = 'rgba(0,0,0,0.65)';
    ctx.fillRect(-15, -e.r - 22, 30, 5);
    ctx.fillStyle = '#22c55e';
    ctx.fillRect(-15, -e.r - 22, 30 * (e.hp / e.maxHp), 5);
  }

  ctx.restore();
}

function drawObstacle(o) {
  ctx.save();
  ctx.translate(o.x, o.y);
  if (o.type === 'ruin') {
    const g = ctx.createLinearGradient(-o.w/2, -o.h, o.w/2, o.h/2);
    g.addColorStop(0, '#2a2228');
    g.addColorStop(1, '#161218');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(-o.w/2, o.h/2);
    ctx.lineTo(-o.w/2 + 4, -o.h);
    ctx.lineTo(o.w/2 - 3, -o.h + 6);
    ctx.lineTo(o.w/2, o.h/2);
    ctx.closePath();
    ctx.fill();
  } else {
    ctx.fillStyle = '#2a221c';
    ctx.beginPath(); ctx.ellipse(0, 4, o.w * 0.55, 8, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#3a3228';
    ctx.beginPath(); ctx.ellipse(-6, -2, 8, 5, -0.4, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(7, -4, 7, 4, 0.3, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

// ==================== PARTICLES ====================
function spawnBlood(x, y, count = 11, power = 100) {
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = power * (0.35 + Math.random() * 0.75);
    particles.push({
      x, y,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp - 50,
      life: 0.45 + Math.random() * 0.55,
      size: 2.2 + Math.random() * 3.5,
      color: Math.random() > 0.25 ? '#6b0a0a' : '#9b1515',
      type: 'blood'
    });
  }
  if (groundStains.length < 90) {
    groundStains.push({
      x: x + (Math.random()-0.5)*12,
      y: y + (Math.random()-0.5)*8,
      r: 6 + Math.random() * 11,
      a: 0.35 + Math.random() * 0.25
    });
  }
}

// ==================== COMBAT ====================
function spawnEnemy(type = 'imp') {
  const ang = Math.random() * Math.PI * 2;
  const dist = 400 + Math.random() * 240;
  let x = player.x + Math.cos(ang) * dist;
  let y = player.y + Math.sin(ang) * dist;
  x = Math.max(70, Math.min(WORLD - 70, x));
  y = Math.max(70, Math.min(WORLD - 70, y));

  let r, hp, speed, xpVal;
  if (type === 'boss') {
    r = 38; hp = 380 + state.time * 4; speed = 70; xpVal = 12;
    bossActive = true;
  } else if (type === 'tank') {
    r = 28; hp = 105 + state.time * 2.4; speed = 86; xpVal = 3;
  } else {
    r = 17; hp = 26 + state.time * 0.95; speed = 128 + Math.random() * 45; xpVal = 1;
  }

  enemies.push({
    x, y, r, hp, maxHp: hp, speed, type, xpVal,
    walkPhase: Math.random() * 10,
    facing: 1,
    dying: false,
    deathScale: 1,
    deathTimer: 0
  });
}

function killEnemy(e) {
  if (e.dying) return;
  e.dying = true;
  e.deathTimer = 0.5;
  e.speed = 0;
  spawnBlood(e.x, e.y - 12, e.type === 'boss' ? 28 : 16, e.type === 'boss' ? 180 : 140);
  shake = Math.max(shake, e.type === 'boss' ? 9 : 4);
  if (meta.settings.vibro && navigator.vibrate) navigator.vibrate(e.type === 'boss' ? 40 : 18);

  if (e.type === 'boss') bossActive = false;

  state.kills++;
  state.xp += e.xpVal * player.xpMult;
  if (state.xp >= state.xpNext) {
    state.xp -= state.xpNext;
    state.level++;
    state.xpNext = Math.floor(state.xpNext * 1.4);
    openLevelUp();
  }
}

function openLevelUp() {
  state.phase = 'upgrade';
  const box = document.getElementById('upgrade-options');
  box.innerHTML = '';
  const opts = [
    { t: '+32% Урон', f: () => player.damageMult *= 1.32 },
    { t: '+24% Скорость атаки', f: () => player.attackRate *= 0.78 },
    { t: '+45 HP + лечение', f: () => { player.maxHp += 45; player.hp = Math.min(player.maxHp, player.hp + 50); } },
    { t: '+17% Скорость', f: () => player.speed *= 1.17 },
    { t: 'Огненная Нова', f: () => { player.hasNova = true; player.novaCD = 0; } }
  ];
  // filter already taken nova
  const available = opts.filter(o => !(o.t === 'Огненная Нова' && player.hasNova));
  for (let i = available.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [available[i], available[j]] = [available[j], available[i]];
  }
  available.slice(0, 3).forEach(o => {
    const b = document.createElement('button');
    b.className = 'btn';
    b.textContent = o.t;
    b.onclick = () => {
      o.f();
      document.getElementById('level-up').style.display = 'none';
      state.phase = 'playing';
    };
    box.appendChild(b);
  });
  document.getElementById('level-up').style.display = 'flex';
}

// ==================== UPDATE ====================
function update(dt) {
  if (state.phase !== 'playing') return;
  state.time += dt;
  if (shake > 0) shake = Math.max(0, shake - dt * 18);

  // FPS
  frames++;
  fpsTimer += dt;
  if (fpsTimer >= 1) {
    fps = frames;
    frames = 0;
    fpsTimer = 0;
  }

  // Movement
  let dx = 0, dy = 0;
  if (keys['KeyW'] || keys['ArrowUp']) dy--;
  if (keys['KeyS'] || keys['ArrowDown']) dy++;
  if (keys['KeyA'] || keys['ArrowLeft']) dx--;
  if (keys['KeyD'] || keys['ArrowRight']) dx++;

  if (touch) {
    const tx = touch.cx - touch.sx;
    const ty = touch.cy - touch.sy;
    if (Math.hypot(tx, ty) > 14) {
      dx += tx * 0.019;
      dy += ty * 0.019;
    }
  }

  if (dx || dy) {
    const l = Math.hypot(dx, dy);
    dx /= l; dy /= l;
    player.x += dx * player.speed * dt;
    player.y += dy * player.speed * dt;
    player.facing = dx >= 0 ? 1 : -1;
    player.walkPhase += dt * 10.5;
  } else {
    player.walkPhase *= 0.88;
  }

  // Obstacles
  for (const o of obstacles) {
    const rw = o.w * 0.45, rh = o.h * 0.4;
    if (Math.abs(player.x - o.x) < player.r + rw && Math.abs(player.y - o.y) < player.r + rh) {
      const pushX = player.x - o.x;
      const pushY = player.y - o.y;
      const len = Math.hypot(pushX, pushY) || 1;
      player.x = o.x + (pushX / len) * (player.r + rw);
      player.y = o.y + (pushY / len) * (player.r + rh);
    }
  }

  player.x = Math.max(40, Math.min(WORLD - 40, player.x));
  player.y = Math.max(40, Math.min(WORLD - 40, player.y));

  // Camera
  let sx = 0, sy = 0;
  if (shake > 0) {
    sx = (Math.random() - 0.5) * shake;
    sy = (Math.random() - 0.5) * shake;
  }
  camera.x += (player.x - W / 2 - camera.x) * 0.11;
  camera.y += (player.y - H / 2 - camera.y) * 0.11;
  camera.x = Math.max(0, Math.min(WORLD - W, camera.x));
  camera.y = Math.max(0, Math.min(WORLD - H, camera.y));
  camera._sx = sx;
  camera._sy = sy;

  // Attack
  player.attackCD -= dt;
  if (player.attacking > 0) player.attacking -= dt;

  if (player.attackCD <= 0 && enemies.length) {
    let nearest = null, md = 340;
    for (const e of enemies) {
      if (e.dying) continue;
      const d = Math.hypot(e.x - player.x, e.y - player.y);
      if (d < md) { md = d; nearest = e; }
    }
    if (nearest) {
      const a = Math.atan2(nearest.y - player.y, nearest.x - player.x);
      projectiles.push({
        x: player.x, y: player.y - 10,
        vx: Math.cos(a) * 500,
        vy: Math.sin(a) * 500,
        life: 0.85, r: 6
      });
      player.attackCD = player.attackRate;
      player.attacking = 0.28;
      player.facing = Math.cos(a) >= 0 ? 1 : -1;
    }
  }

  // Nova
  if (player.hasNova) {
    player.novaCD -= dt;
    if (player.novaCD <= 0) {
      player.novaCD = 4.2;
      // visual ring via particles
      for (let i = 0; i < 16; i++) {
        const a = (i / 16) * Math.PI * 2;
        particles.push({
          x: player.x + Math.cos(a) * 20,
          y: player.y + Math.sin(a) * 20,
          vx: Math.cos(a) * 180,
          vy: Math.sin(a) * 180,
          life: 0.45, size: 4, color: '#ff4400', type: 'blood'
        });
      }
      for (const e of enemies) {
        if (e.dying) continue;
        if (Math.hypot(e.x - player.x, e.y - player.y) < 130) {
          e.hp -= 38 * player.damageMult;
          spawnBlood(e.x, e.y - 8, 6, 70);
          if (e.hp <= 0) killEnemy(e);
        }
      }
    }
  }

  // Projectiles
  for (let i = projectiles.length - 1; i >= 0; i--) {
    const p = projectiles[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.life -= dt;
    let hit = false;
    for (const e of enemies) {
      if (e.dying) continue;
      if (Math.hypot(p.x - e.x, p.y - e.y) < p.r + e.r) {
        e.hp -= player.damage * player.damageMult;
        spawnBlood(e.x, e.y - 10, 7, 80);
        hit = true;
        if (e.hp <= 0) killEnemy(e);
        break;
      }
    }
    if (hit || p.life <= 0) projectiles.splice(i, 1);
  }

  // Enemies
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    if (e.dying) {
      e.deathTimer -= dt;
      e.deathScale *= 0.91;
      if (e.deathTimer <= 0) enemies.splice(i, 1);
      continue;
    }

    const dx = player.x - e.x;
    const dy = player.y - e.y;
    const dist = Math.hypot(dx, dy);
    if (dist > 5) {
      e.x += (dx / dist) * e.speed * dt;
      e.y += (dy / dist) * e.speed * dt;
      e.facing = dx >= 0 ? 1 : -1;
      e.walkPhase += dt * 8.5;
    }

    if (dist < player.r + e.r - 5) {
      const dmg = e.type === 'boss' ? 38 : e.type === 'tank' ? 27 : 16;
      player.hp -= dmg * dt;
      if (player.hp <= 0) {
        player.hp = 0;
        gameOver();
        return;
      }
    }
  }

  // Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.vy += 260 * dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }

  // Spawns
  spawnT -= dt;
  if (spawnT <= 0) {
    spawnEnemy('imp');
    spawnT = Math.max(0.36, 1.28 - state.time * 0.012);
  }
  tankT -= dt;
  if (tankT <= 0) {
    spawnEnemy('tank');
    tankT = Math.max(5.8, 12 - state.time * 0.05);
  }
  if (!bossActive) {
    bossT -= dt;
    if (bossT <= 0) {
      spawnEnemy('boss');
      bossT = 70;
    }
  }

  // UI
  document.getElementById('time').textContent = state.time | 0;
  document.getElementById('kills').textContent = state.kills;
  document.getElementById('level').textContent = state.level;
  document.getElementById('xp').textContent = state.xp | 0;
  document.getElementById('xp-next').textContent = state.xpNext;
  document.getElementById('hp-bar').style.width = Math.max(0, player.hp / player.maxHp * 100) + '%';
}

// ==================== DRAW ====================
function draw() {
  ctx.clearRect(0, 0, W, H);

  ctx.save();
  ctx.translate(-camera.x + (camera._sx || 0), -camera.y + (camera._sy || 0));

  ctx.fillStyle = '#0a0709';
  ctx.fillRect(0, 0, WORLD, WORLD);

  ctx.strokeStyle = 'rgba(255,255,255,0.014)';
  ctx.lineWidth = 1;
  for (let x = 0; x < WORLD; x += 64) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, WORLD); ctx.stroke();
  }
  for (let y = 0; y < WORLD; y += 64) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(WORLD, y); ctx.stroke();
  }

  for (const s of groundStains) {
    ctx.fillStyle = `rgba(60, 8, 8, ${s.a})`;
    ctx.beginPath();
    ctx.ellipse(s.x, s.y, s.r, s.r * 0.55, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.strokeStyle = '#2a1418';
  ctx.lineWidth = 10;
  ctx.strokeRect(5, 5, WORLD - 10, WORLD - 10);

  for (const o of obstacles) drawObstacle(o);

  for (const p of particles) {
    ctx.globalAlpha = Math.min(1, p.life * 2.2);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  for (const p of projectiles) {
    ctx.fillStyle = '#ff2a00';
    ctx.shadowColor = '#ff1100';
    ctx.shadowBlur = 14;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 6, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  const drawList = [...enemies.map(e => ({type:'enemy', e, y: e.y})), {type:'player', y: player.y}];
  drawList.sort((a, b) => a.y - b.y);
  for (const item of drawList) {
    if (item.type === 'player') drawPlayer();
    else drawEnemy(item.e);
  }

  ctx.restore();

  // Vignette
  const vig = ctx.createRadialGradient(W/2, H/2, H * 0.2, W/2, H/2, H * 0.78);
  vig.addColorStop(0, 'rgba(0,0,0,0)');
  vig.addColorStop(0.7, 'rgba(0,0,0,0.25)');
  vig.addColorStop(1, 'rgba(0,0,0,0.72)');
  ctx.fillStyle = vig;
  ctx.fillRect(0, 0, W, H);

  if (touch) {
    ctx.strokeStyle = 'rgba(200,140,90,0.35)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(touch.sx, touch.sy, 34, 0, Math.PI * 2);
    ctx.stroke();
    ctx.fillStyle = 'rgba(200,140,90,0.55)';
    ctx.beginPath();
    ctx.arc(touch.cx, touch.cy, 14, 0, Math.PI * 2);
    ctx.fill();
  }

  if (meta.settings.showFps) {
    ctx.fillStyle = '#8a6a5a';
    ctx.font = '12px system-ui';
    ctx.textAlign = 'right';
    ctx.fillText(fps + ' FPS', W - 12, 24);
  }
}

// ==================== LOOP ====================
function loop(ts) {
  if (!lastTs) lastTs = ts;
  let dt = (ts - lastTs) / 1000;
  if (dt > 0.08) dt = 0.08;
  lastTs = ts;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// ==================== INPUT ====================
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'Escape') {
    if (state.phase === 'playing') openPause();
    else if (state.phase === 'paused') closePause();
  }
});
addEventListener('keyup', e => keys[e.code] = false);

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  if (state.phase !== 'playing') return;
  const t = e.changedTouches[0];
  touch = { id: t.identifier, sx: t.clientX, sy: t.clientY, cx: t.clientX, cy: t.clientY };
}, { passive: false });

canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (!touch) return;
  for (const t of e.changedTouches) {
    if (t.identifier === touch.id) {
      touch.cx = t.clientX;
      touch.cy = t.clientY;
    }
  }
}, { passive: false });

canvas.addEventListener('touchend', e => { e.preventDefault(); touch = null; });
canvas.addEventListener('touchcancel', () => touch = null);

// ==================== SCREENS ====================
function hideAllScreens() {
  ['main-menu','shop-screen','settings-screen','pause-screen','game-over','level-up'].forEach(id => {
    document.getElementById(id).style.display = 'none';
  });
}

function startGame() {
  resetPlayer();
  generateWorld();
  enemies = [];
  projectiles = [];
  particles = [];
  groundStains = [];
  state = { phase: 'playing', time: 0, kills: 0, level: 1, xp: 0, xpNext: 6 };
  spawnT = 1.05;
  tankT = 9.5;
  bossT = 70;
  bossActive = false;
  shake = 0;

  hideAllScreens();
  document.getElementById('ui').style.display = 'block';
  document.getElementById('hp-wrap').style.display = 'block';
  document.getElementById('pause-btn').style.display = 'flex';
}

function gameOver() {
  state.phase = 'gameover';
  const t = state.time | 0;
  const k = state.kills;
  const coins = Math.floor(t * 1.8 + k * 0.7);
  meta.coins += coins;
  if (t > meta.bestTime) meta.bestTime = t;
  if (k > meta.bestKills) meta.bestKills = k;
  saveMeta();

  document.getElementById('final-time').textContent = t;
  document.getElementById('final-kills').textContent = k;
  document.getElementById('best-time').textContent = meta.bestTime;
  document.getElementById('best-kills').textContent = meta.bestKills;
  document.getElementById('coins-earned').textContent = `+${coins} монет`;

  hideAllScreens();
  document.getElementById('game-over').style.display = 'flex';
  document.getElementById('ui').style.display = 'none';
  document.getElementById('hp-wrap').style.display = 'none';
  document.getElementById('pause-btn').style.display = 'none';
}

function openPause() {
  state.phase = 'paused';
  document.getElementById('pause-screen').style.display = 'flex';
  document.getElementById('pause-btn').textContent = '▶';
}

function closePause() {
  state.phase = 'playing';
  document.getElementById('pause-screen').style.display = 'none';
  document.getElementById('pause-btn').textContent = '⏸';
}

function showShop() {
  hideAllScreens();
  document.getElementById('shop-screen').style.display = 'flex';
  document.getElementById('coin-display').textContent = `Монеты: ${meta.coins}`;
  const box = document.getElementById('shop-items');
  box.innerHTML = '';

  const items = [
    { type: 'damage', name: 'Урон', desc: '+11% за уровень' },
    { type: 'maxHp', name: 'Макс. HP', desc: '+22 HP за уровень' },
    { type: 'attackSpeed', name: 'Скорость атаки', desc: '+13% за уровень' },
    { type: 'moveSpeed', name: 'Скорость движения', desc: '+9% за уровень' },
    { type: 'xpGain', name: 'Получение опыта', desc: '+14% за уровень' }
  ];

  items.forEach(it => {
    const lvl = meta.upgrades[it.type] || 0;
    const cost = upgradeCost(it.type, lvl);
    const div = document.createElement('div');
    div.className = 'shop-item';
    div.innerHTML = `
      <div class="info">
        <div class="name">${it.name} <span style="color:#8a6a5a">ур.${lvl}</span></div>
        <div class="desc">${it.desc}</div>
      </div>
      <button class="btn small" ${meta.coins < cost ? 'disabled' : ''}>${cost} 🪙</button>
    `;
    const btn = div.querySelector('button');
    btn.onclick = () => {
      if (meta.coins >= cost) {
        meta.coins -= cost;
        meta.upgrades[it.type] = lvl + 1;
        saveMeta();
        showShop();
      }
    };
    box.appendChild(div);
  });
}

function showSettings() {
  hideAllScreens();
  document.getElementById('settings-screen').style.display = 'flex';
  document.getElementById('set-vibro').checked = meta.settings.vibro;
  document.getElementById('set-fps').checked = meta.settings.showFps;
}

// Events
document.getElementById('play-btn').onclick = startGame;
document.getElementById('restart-btn').onclick = startGame;
document.getElementById('pause-restart').onclick = startGame;
document.getElementById('shop-btn').onclick = showShop;
document.getElementById('to-shop-btn').onclick = showShop;
document.getElementById('shop-back').onclick = () => {
  hideAllScreens();
  document.getElementById('main-menu').style.display = 'flex';
};
document.getElementById('settings-btn').onclick = showSettings;
document.getElementById('settings-back').onclick = () => {
  meta.settings.vibro = document.getElementById('set-vibro').checked;
  meta.settings.showFps = document.getElementById('set-fps').checked;
  saveMeta();
  hideAllScreens();
  document.getElementById('main-menu').style.display = 'flex';
};
document.getElementById('to-menu-btn').onclick = () => {
  hideAllScreens();
  document.getElementById('main-menu').style.display = 'flex';
};
document.getElementById('pause-menu').onclick = () => {
  hideAllScreens();
  document.getElementById('main-menu').style.display = 'flex';
  document.getElementById('ui').style.display = 'none';
  document.getElementById('hp-wrap').style.display = 'none';
  document.getElementById('pause-btn').style.display = 'none';
  state.phase = 'menu';
};
document.getElementById('resume-btn').onclick = closePause;
document.getElementById('pause-btn').onclick = () => {
  if (state.phase === 'playing') openPause();
  else if (state.phase === 'paused') closePause();
};
document.getElementById('reset-btn').onclick = () => {
  if (confirm('Сбросить весь прогресс?')) {
    meta = structuredClone(defaultMeta);
    saveMeta();
    alert('Прогресс сброшен');
  }
};
</script>
